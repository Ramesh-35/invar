name: INVAR contract check
description: >-
  Check the cross-repository contracts declared in invar.toml. Remote artifacts
  referenced as github:OWNER/REPO@REF:PATH are fetched in-process, BLAKE3-hashed
  and never written to disk. A contract violation fails the job; an evaluation
  ERROR fails it separately and is never reported as a verdict.
author: INVAR
branding:
  icon: shield
  color: gray-dark

inputs:
  config:
    description: Path to invar.toml, relative to the workspace.
    required: false
    default: invar.toml
  base_ref:
    description: Baseline ref substituted for {base} in remote references.
    required: false
    default: ${{ github.base_ref }}
  github_token:
    description: Token for remote spec fetches and for posting the PR comment.
    required: false
    default: ${{ github.token }}
  post_comment:
    description: Post or update a markdown report on the PR when a contract is violated (and refresh it once contracts hold again).
    required: false
    default: 'true'
  fail_on_violation:
    description: Fail the job on a contract violation. 'false' gives report-only mode. Errors always fail.
    required: false
    default: 'true'
  release_token:
    description: >-
      Token used only to download the signed release binary (needs read access
      to this action's repository). Defaults to github_token. Set it when the
      action's repository is private and github_token cannot read it.
    required: false
    default: ''
  version:
    description: Release tag of the binary to download. Defaults to the action ref; if no release asset matches, the action builds from source.
    required: false
    default: ''
  check:
    description: Run `invar check`. Set 'false' in a pure producer repository (no contracts of its own) that only evaluates its consumers.
    required: false
    default: 'true'
  dependents_repo:
    description: This repository's identity, OWNER/NAME. When set, the signed consumer locks under dependents_locks are evaluated against this change (advisory, never fails the job) and reported on the PR.
    required: false
    default: ''
  dependents_locks:
    description: Directory of consumer invar.lock files (for example a checkout of a shared index), relative to the workspace.
    required: false
    default: ''
  dependents_signers:
    description: Allowed-signers file trusting the consumer repositories. Without it, nothing is evaluated (stated).
    required: false
    default: ''

outputs:
  exit_code:
    description: invar check exit code (0 hold, 1 violated, 2 ledger break, 3 error, 4 some contracts skipped or not evaluated).
    value: ${{ steps.check.outputs.exit_code }}
  verdict:
    description: hold | violated | ledger_break | error | skipped
    value: ${{ steps.check.outputs.verdict }}
  report:
    description: Path to the markdown report (absent on error).
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - name: Resolve invar binary
      id: bin
      shell: bash
      env:
        INVAR_VERSION: ${{ inputs.version }}
        INVAR_ACTION_REPO: ${{ github.action_repository }}
        INVAR_ACTION_REF: ${{ github.action_ref }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.release_token || inputs.github_token }}
      run: bash "$INVAR_ACTION_PATH/action/install.sh"

    - name: Run invar check --ci
      id: check
      if: inputs.check == 'true'
      shell: bash
      env:
        INVAR_BIN: ${{ steps.bin.outputs.bin }}
        INVAR_CONFIG: ${{ inputs.config }}
        INVAR_BASE_REF: ${{ inputs.base_ref }}
        INVAR_TOKEN: ${{ inputs.github_token }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$INVAR_ACTION_PATH/action/run.sh"

    - name: Post or refresh PR comment
      if: (steps.check.outputs.exit_code == '0' || steps.check.outputs.exit_code == '1') && inputs.post_comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INVAR_EXIT: ${{ steps.check.outputs.exit_code }}
        INVAR_REPORT: ${{ steps.check.outputs.report }}
        INVAR_PR: ${{ github.event.pull_request.number }}
        INVAR_REPO: ${{ github.repository }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$INVAR_ACTION_PATH/action/comment.sh"

    - name: Evaluate consumer locks (advisory)
      id: dependents
      if: inputs.dependents_repo != ''
      shell: bash
      env:
        INVAR_BIN: ${{ steps.bin.outputs.bin }}
        INVAR_DEPENDENTS_REPO: ${{ inputs.dependents_repo }}
        INVAR_DEPENDENTS_LOCKS: ${{ inputs.dependents_locks }}
        INVAR_DEPENDENTS_SIGNERS: ${{ inputs.dependents_signers }}
        INVAR_BASE_REF: ${{ inputs.base_ref }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$INVAR_ACTION_PATH/action/dependents.sh"

    - name: Post or refresh consumer report
      if: inputs.dependents_repo != '' && steps.dependents.outputs.dependents_report != '' && inputs.post_comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INVAR_MARKER: '<!-- invar-dependents -->'
        INVAR_EXIT: ${{ steps.dependents.outputs.dependents_broken != '0' && '1' || '0' }}
        INVAR_REPORT: ${{ steps.dependents.outputs.dependents_report }}
        INVAR_PR: ${{ github.event.pull_request.number }}
        INVAR_REPO: ${{ github.repository }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$INVAR_ACTION_PATH/action/comment.sh"

    - name: Gate
      if: inputs.check == 'true'
      shell: bash
      env:
        INVAR_EXIT: ${{ steps.check.outputs.exit_code }}
        INVAR_FAIL_ON_VIOLATION: ${{ inputs.fail_on_violation }}
        INVAR_ACTION_PATH: ${{ github.action_path }}
      run: bash "$INVAR_ACTION_PATH/action/gate.sh"
