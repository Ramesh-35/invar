name: a2-receipts-gate
# A2 determinism gate (docs/architecture/A2-RECEIPTS.md): every corpus config
# yields a byte-identical receipt on Linux and macOS, and verify-receipt
# reproduces each one. Run on demand; both jobs run in one workflow so the
# receipts share an as_of date (re-run the whole workflow if it straddles
# midnight UTC).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - run: cargo build --locked --release
      - name: run gate
        run: |
          bash scripts/a2-gate.sh target/release/invar corpus-real "receipts-${{ matrix.os }}.txt"
          grep -vc ' OK ' "receipts-${{ matrix.os }}.txt" | grep -qx 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receipts-${{ matrix.os }}
          path: receipts-${{ matrix.os }}.txt
  compare:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: receipts must be byte-identical across platforms
        run: |
          diff <(sort receipts-ubuntu-latest/receipts-ubuntu-latest.txt) \
               <(sort receipts-macos-latest/receipts-macos-latest.txt)
          echo "cross-platform: identical"
