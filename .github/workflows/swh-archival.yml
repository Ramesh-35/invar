# Install as .github/workflows/swh-archival.yml (founder-installed per
# standing rule; the engineer delivers workflows as .new files).
# Weekly re-verification that every pinned upstream origin remains in
# the Software Heritage archive. Absence fails the run loudly.
name: swh archival re-verification
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/swh-verify.sh
