name: invar-falsify CI

# Phase-1 CI: build and test the falsification instrument, validate the corpus
# manifest, and run the harness with Semgrep genuinely installed so the static
# leg executes. A run whose required leg is SKIPPED is honest (UNKNOWN), not a
# failure — CI does not force verdicts.

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  pinned-actions:
    # Every third-party action is pinned to a full commit SHA (tags are
    # mutable: tj-actions/changed-files, CVE-2025-30066).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check-pins.sh

  dependency-audit:
    # SECURITY-SPEC S3-3: every dependency against the RustSec advisory
    # database. An advisory is ignored only by an entry in .cargo/audit.toml
    # that carries its id and a written reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings

  reproducible-build:
    # SECURITY-SPEC S3-4: two clean release builds from two checkout paths,
    # and their packed archives, must be identical byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: bash scripts/release/repro-check.sh "$RUNNER_TEMP/repro"

  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (acceptance)
        run: cargo test --workspace --locked

      - name: Install Semgrep (so the static leg genuinely executes)
        run: pip install semgrep

      - name: Validate manifest
        run: cargo run -p invar-falsify --locked -- validate --manifest corpus_manifest.json

      - name: Run falsification harness
        run: |
          cargo run -p invar-falsify --locked -- run \
            --manifest corpus_manifest.json \
            --composite composite.toml \
            --output runs/ci

      - name: Verify ledger integrity
        run: cargo run -p invar-falsify --locked -- verify --ledger runs/ci/ledger.db

      - name: Upload run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: falsification-run
          path: |
            runs/ci/run_results.json
            runs/ci/EPISTEMIC_REPORT.md

  action-selftest:
    # Runs this repo's GitHub Action (uses: ./) on a real runner against
    # REAL-INCIDENT-001: producer schema committed as a fixture, consumer
    # fetched in-process from GitHub at C1. Asserts the verdict and that the
    # runner fetched byte-identical content (same BLAKE3 as the out-of-band
    # copy), and that a bogus SHA is an ERROR (exit 3), never a verdict.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: INVAR on REAL-INCIDENT-001 (expect violated)
        id: real
        uses: ./
        with:
          config: tests/fixtures/action-selftest/invar.toml
          post_comment: 'false'
          fail_on_violation: 'false'

      - name: Assert violated, with in-process provenance
        env:
          VERDICT: ${{ steps.real.outputs.verdict }}
          REPORT: ${{ steps.real.outputs.report }}
        run: |
          test "$VERDICT" = violated
          grep -q 'amount_cents' "$REPORT"
          grep -q 'ecd0a60aa8fd380e574fae70e75810da57f3b43c744ec03d492bc3b21c576f69' "$REPORT"

      - name: INVAR on a bogus SHA (expect ERROR, not a verdict)
        id: bogus
        uses: ./
        continue-on-error: true
        with:
          config: tests/fixtures/action-selftest/bogus.toml
          post_comment: 'false'

      - name: Assert the error is not reported as a verdict
        env:
          VERDICT: ${{ steps.bogus.outputs.verdict }}
          CODE: ${{ steps.bogus.outputs.exit_code }}
        run: |
          test "$VERDICT" = error
          test "$CODE" = 3
