name: release

# On a version tag, build standalone invar binaries and publish them to
# a GitHub Release with SHA-256 checksums and SSH signatures (the GitHub
# Action verifies both before use; the trusted key is action/release-signers).
# cross builds the static Linux musl target in Docker. cross has no macOS images, so both Apple targets are built natively on a macOS runner.
# A run can also be started by hand for an existing tag (workflow_dispatch),
# so a tag whose run failed for a reason outside its source gets its release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release, for example v0.2.14
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag must match the crate version
        run: |
          v=$(grep -m1 '^version' crates/invar-falsify/Cargo.toml | cut -d'"' -f2)
          if [ "$RELEASE_TAG" != "v$v" ]; then
            echo "::error::tag $RELEASE_TAG does not match crate version v$v"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, tool: cross }
          - { target: x86_64-apple-darwin, os: macos-15, tool: cargo }
          - { target: aarch64-apple-darwin, os: macos-15, tool: cargo }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TOOL: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        run: $TOOL build --release --locked -p invar-falsify --target "$TARGET"
      - name: Verify static linkage (Linux musl)
        if: matrix.tool == 'cross'
        run: |
          file "target/$TARGET/release/invar"
          ! ldd "target/$TARGET/release/invar" 2>/dev/null | grep -q "=>"
      - name: Smoke test (targets this runner can execute)
        if: matrix.target != 'x86_64-apple-darwin'
        run: "target/$TARGET/release/invar --version"
      - name: Package with checksum
        run: |
          asset="invar-${RELEASE_TAG}-${TARGET}.tar.gz"
          # SECURITY-SPEC S3-4: byte-reproducible archive (time 0, owner 0).
          python3 scripts/release/pack.py "target/$TARGET/release/invar" "$asset"
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invar-${{ matrix.target }}
          path: invar-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign each binary archive (SSH signature, namespace invar-release)
        env:
          SIGNING_KEY: ${{ secrets.INVAR_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::INVAR_RELEASE_SIGNING_KEY is not set; refusing to publish unsigned binaries"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          for f in dist/*.tar.gz; do
            ssh-keygen -Y sign -f "$key" -n invar-release "$f"
            # Self-check against the committed public key, so a release never
            # ships a signature the Action would reject.
            ssh-keygen -Y verify -f action/release-signers -I invar-release \
              -n invar-release -s "$f.sig" < "$f"
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v0.1.0-alpha) is a prerelease, never "Latest".
          pre=()
          case "$RELEASE_TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" dist/* "${pre[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
            --notes "Standalone invar binaries (MIT OR Apache-2.0) with SHA-256 checksums and SSH signatures. What INVAR does and does not yet establish: docs/epistemic/STATUS.md."
