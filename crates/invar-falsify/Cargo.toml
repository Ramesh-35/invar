[package]
name = "invar-falsify"
version = "0.2.0"
edition = "2021"
description = "A contract firewall for CI: judges breaking changes to the promises between repositories, and states what it could not check."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ramesh-35/invar"
homepage = "https://github.com/Ramesh-35/invar"
readme = "../../README.md"
keywords = ["ci", "contracts", "breaking-changes", "json-schema", "verification"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "invar"
path = "src/main.rs"

[lib]
name = "invar_falsify"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
anyhow = "1"

[build-dependencies]
# CHECK-INCR-1 engine identity (build.rs); the same crate as [dependencies].
blake3 = "1"

[dev-dependencies]
# Used only by the ledger tamper test to edit a committed row out-of-band.
rusqlite = { version = "0.32", features = ["bundled"] }
