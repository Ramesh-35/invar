[package]
name = "invar-falsify"
version = "0.1.0-alpha.7"
edition = "2021"
description = "INVAR Phase-1 deterministic falsification instrument (EICS category-residue probe)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "invar"
path = "src/main.rs"

[lib]
name = "invar_falsify"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
# Used only by the ledger tamper test to edit a committed row out-of-band.
rusqlite = { version = "0.32", features = ["bundled"] }
